<text x="24" y="762" class="cap">The scenario enters at exactly two places (amber): the GraphSAGE embedding and the edge-existence / degree-ratio channel. Both read the adjacency as an</text>
<text x="24" y="778" class="cap">input rather than memorising it, which is why a discriminator trained on except 1–99 transfers zero-shot to the unseen except_0 scenario.</text>
